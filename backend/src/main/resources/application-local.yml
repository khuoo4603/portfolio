spring:
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:portfolio}
    username: ${POSTGRES_USER:portfolio}
    password: ${DB_PASSWORD}

server:
  servlet:
    session:
      cookie:
        secure: false

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true

portfolio:
  file:
    storage-root: ${FILE_STORAGE_ROOT:../storage/dev}
  swagger:
    enabled: true
    public-access: true
