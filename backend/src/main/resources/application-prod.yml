spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${DB_PASSWORD}

server:
  servlet:
    session:
      cookie:
        secure: true

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

portfolio:
  file:
    resume-directory: ${RESUME_STORAGE_PATH:/opt/Portfolio/prod/files/resume}
  swagger:
    enabled: false
    public-access: false
