spring:
  application:
    name: portfolio-backend
  datasource:
    hikari:
      connection-init-sql: SET TIME ZONE 'Asia/Seoul'
  flyway:
    enabled: true
  jackson:
    time-zone: Asia/Seoul
  jpa:
    hibernate:
      ddl-auto: validate
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_APP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  session:
    jdbc:
      initialize-schema: never
      table-name: spring_session
    timeout: ${SESSION_IDLE_TIMEOUT:8h}

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
    session:
      cookie:
        http-only: true
        name: ${SESSION_COOKIE_NAME:PORTFOLIO_SESSION}
        path: /
        same-site: Lax
      timeout: ${SESSION_IDLE_TIMEOUT:8h}

logging:
  file:
    path: ${LOG_PATH:build/logs}

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

portfolio:
  file:
    resume-directory: ${RESUME_STORAGE_PATH:build/files/resume}
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:}}
  swagger:
    enabled: false
    public-access: false

management:
  health:
    mail:
      enabled: false
  endpoints:
    enabled-by-default: false
    web:
      exposure:
        include: health
  endpoint:
    health:
      enabled: true
      probes:
        enabled: true
      show-details: never
