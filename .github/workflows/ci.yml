name: Frontend CI

on:
  pull_request:
    branches:
      - develop
      - main

concurrency:
  group: frontend-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect frontend changes
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(frontend/|\.github/workflows/ci\.yml$)'; then
            echo "frontend_changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend_changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: steps.changes.outputs.frontend_changed == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 24.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.frontend_changed == 'true'
        working-directory: frontend
        run: npm ci

      - name: Lint
        if: steps.changes.outputs.frontend_changed == 'true'
        working-directory: frontend
        run: npm run lint

      - name: Type check
        if: steps.changes.outputs.frontend_changed == 'true'
        working-directory: frontend
        run: npm run typecheck

      - name: Test
        if: steps.changes.outputs.frontend_changed == 'true'
        working-directory: frontend
        run: npm run test

      - name: Build
        if: steps.changes.outputs.frontend_changed == 'true'
        working-directory: frontend
        run: npm run build
