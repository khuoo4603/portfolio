name: Frontend CD

on:
  push:
    branches:
      - develop
      - main
    paths:
      - frontend/**
      - infra/**
      - .github/workflows/cd-frontend.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  target:
    name: Resolve deployment target
    runs-on: ubuntu-latest
    outputs:
      target_env: ${{ steps.target.outputs.target_env }}
      github_environment: ${{ steps.target.outputs.github_environment }}
    steps:
      - id: target
        shell: bash
        run: |
          set -euo pipefail
          case "$GITHUB_REF" in
            refs/heads/develop)
              echo "target_env=dev" >> "$GITHUB_OUTPUT"
              echo "github_environment=development" >> "$GITHUB_OUTPUT"
              ;;
            refs/heads/main)
              echo "target_env=prod" >> "$GITHUB_OUTPUT"
              echo "github_environment=production" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Unsupported deployment branch: $GITHUB_REF" >&2
              exit 1
              ;;
          esac

  build:
    name: Frontend CD · Build
    needs: target
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      frontend_image: ${{ steps.images.outputs.frontend_image }}
      backend_image: ${{ steps.images.outputs.backend_image }}
      image_tag: ${{ steps.images.outputs.image_tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Resolve image names
        id: images
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "frontend_image=ghcr.io/$owner/portfolio-frontend" >> "$GITHUB_OUTPUT"
          echo "backend_image=ghcr.io/$owner/portfolio-backend" >> "$GITHUB_OUTPUT"
          echo "image_tag=sha-$GITHUB_SHA" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push frontend
        uses: docker/build-push-action@v7
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.images.outputs.frontend_image }}:${{ steps.images.outputs.image_tag }}
          cache-from: type=gha,scope=portfolio-frontend
          cache-to: type=gha,mode=max,scope=portfolio-frontend

  deploy:
    name: Frontend CD · ${{ needs.target.outputs.target_env }}
    needs:
      - target
      - build
    runs-on:
      - self-hosted
      - Linux
      - X64
      - portfolio
      - deploy
    environment: ${{ needs.target.outputs.github_environment }}
    concurrency:
      group: portfolio-deploy-${{ needs.target.outputs.target_env }}
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy frontend
        shell: bash
        env:
          TARGET_ENV: ${{ needs.target.outputs.target_env }}
          FRONTEND_IMAGE: ${{ needs.build.outputs.frontend_image }}
          BACKEND_IMAGE: ${{ needs.build.outputs.backend_image }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          PUBLIC_SITE_URL: ${{ vars.PUBLIC_SITE_URL }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
          POSTGRES_USER: ${{ vars.POSTGRES_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MAIL_HOST: ${{ vars.MAIL_HOST }}
          MAIL_PORT: ${{ vars.MAIL_PORT }}
          MAIL_USERNAME: ${{ vars.MAIL_USERNAME }}
          MAIL_FROM: ${{ vars.MAIL_FROM }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_SMTP_AUTH: ${{ vars.MAIL_SMTP_AUTH }}
          MAIL_SMTP_STARTTLS_ENABLE: ${{ vars.MAIL_SMTP_STARTTLS_ENABLE }}
          SESSION_COOKIE_NAME: ${{ vars.SESSION_COOKIE_NAME }}
          SESSION_IDLE_TIMEOUT: ${{ vars.SESSION_IDLE_TIMEOUT }}
          SMOKE_FRONTEND_BASE_URL: ${{ vars.SMOKE_FRONTEND_BASE_URL }}
          SMOKE_API_BASE_URL: ${{ vars.SMOKE_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${RUNNER_TEMP:-}" || ! -d "$RUNNER_TEMP" || ! -w "$RUNNER_TEMP" ]]; then
            echo "RUNNER_TEMP is unavailable." >&2
            exit 1
          fi
          temporary_env="$(mktemp "${RUNNER_TEMP%/}/portfolio-${TARGET_ENV}-XXXXXX.env")"
          chmod 600 "$temporary_env"
          trap 'rm -f -- "$temporary_env"' EXIT

          append_env() {
            local key="$1"
            local value="$2"
            if [[ -z "$value" || "$value" == *$'\n'* || "$value" == *$'\r'* ]]; then
              echo "Required deployment environment value is invalid: $key" >&2
              exit 1
            fi
            value="${value//\'/\\\'}"
            printf "%s='%s'\n" "$key" "$value" >> "$temporary_env"
          }

          append_env FRONTEND_IMAGE "$FRONTEND_IMAGE"
          append_env BACKEND_IMAGE "$BACKEND_IMAGE"
          append_env PUBLIC_SITE_URL "$PUBLIC_SITE_URL"
          append_env POSTGRES_DB "$POSTGRES_DB"
          append_env POSTGRES_USER "$POSTGRES_USER"
          append_env DB_PASSWORD "$DB_PASSWORD"
          append_env MAIL_HOST "${MAIL_HOST:-smtp.gmail.com}"
          append_env MAIL_PORT "${MAIL_PORT:-587}"
          append_env MAIL_USERNAME "$MAIL_USERNAME"
          append_env MAIL_FROM "$MAIL_FROM"
          append_env MAIL_APP_PASSWORD "$MAIL_APP_PASSWORD"
          append_env MAIL_SMTP_AUTH "${MAIL_SMTP_AUTH:-true}"
          append_env MAIL_SMTP_STARTTLS_ENABLE "${MAIL_SMTP_STARTTLS_ENABLE:-true}"
          append_env SESSION_COOKIE_NAME "${SESSION_COOKIE_NAME:-PORTFOLIO_SESSION}"
          append_env SESSION_IDLE_TIMEOUT "${SESSION_IDLE_TIMEOUT:-8h}"
          append_env SMOKE_FRONTEND_BASE_URL "$SMOKE_FRONTEND_BASE_URL"
          append_env SMOKE_API_BASE_URL "$SMOKE_API_BASE_URL"

          bash infra/scripts/deploy.sh "$TARGET_ENV" frontend "$IMAGE_TAG" "$temporary_env"
